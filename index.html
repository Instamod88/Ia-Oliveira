<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oliveira 2s - IA Completa</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0a0a; 
            color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #header { 
            padding: 15px; 
            background: #141414;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #header-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        #header h1 { 
            font-size: 20px; 
            background: linear-gradient(45deg, #007AFF, #00C6FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .creator-link {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #E1306C;
            text-decoration: none;
            font-size: 13px;
            padding: 6px 12px;
            background: rgba(225, 48, 108, 0.1);
            border-radius: 20px;
            border: 1px solid rgba(225, 48, 108, 0.3);
        }
        .online { 
            color: #4CAF50; 
            font-size: 10px;
            margin-left: 8px;
        }
        #status { 
            font-size: 12px; 
            color: #888;
            padding: 8px 15px;
            background: #141414;
            display: flex;
            gap: 10px;
            align-items: center;
            border-bottom: 1px solid #222;
            flex-wrap: wrap;
        }
        #model-select, #mode-select {
            background: #333;
            color: #fff;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
        }
        #chat { 
            flex: 1; 
            overflow-y: auto; 
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .msg { 
            max-width: 90%; 
            padding: 12px 16px; 
            border-radius: 18px;
            line-height: 1.5;
            word-wrap: break-word;
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .user { 
            background: #007AFF; 
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .ai { 
            background: #1c1c1e; 
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid #333;
        }
        .ai-name {
            font-size: 11px;
            color: #007AFF;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .code-block {
            background: #000;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 12px;
            margin: 8px 0;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            overflow-x: auto;
            white-space: pre-wrap;
        }
        .calc-box {
            background: #1c3d1c;
            border-left: 3px solid #4CAF50;
            padding: 10px;
            margin: 8px 0;
            border-radius: 0 8px 8px 0;
        }
        .image-container {
            margin: 10px 0;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #333;
        }
        .image-container img {
            width: 100%;
            max-width: 400px;
            display: block;
        }
        .image-prompt {
            background: #1c1c1e;
            padding: 8px 12px;
            font-size: 12px;
            color: #aaa;
            border-top: 1px solid #333;
        }
        #input-area { 
            display: flex; 
            padding: 15px; 
            background: #141414;
            gap: 10px;
            border-top: 1px solid #333;
            align-items: center;
        }
        #msg { 
            flex: 1; 
            padding: 12px 16px; 
            border: none;
            border-radius: 20px;
            background: #1c1c1e;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        #msg::placeholder { color: #666; }
        button { 
            padding: 12px 20px; 
            background: #007AFF;
            color: #fff;
            border: none;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
        }
        button:disabled { 
            background: #333; 
            cursor: not-allowed;
        }
        .btn-icon {
            padding: 12px;
            background: #333;
            font-size: 18px;
        }
        .btn-image {
            background: linear-gradient(45deg, #E1306C, #F77737);
        }
        #admin-btn {
            background: #333;
            padding: 8px 12px;
            font-size: 14px;
        }
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 15px;
        }
        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #666;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        #modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        #modal-content {
            background: #1a1a1a;
            padding: 25px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            border: 1px solid #333;
        }
        #modal-content h3 { margin-bottom: 15px; color: #fff; }
        #modal-content input, #modal-content textarea, #modal-content select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: none;
            border-radius: 8px;
            background: #2c2c2e;
            color: #fff;
            font-size: 14px;
        }
        .admin-grid {
            display: grid;
            gap: 10px;
            margin-top: 15px;
        }
        .admin-grid button {
            width: 100%;
            padding: 12px;
        }
        .btn-red { background: #ff4444 !important; }
        .btn-green { background: #4CAF50 !important; }
        .btn-yellow { background: #ff9800 !important; }
        .btn-purple { background: #9c27b0 !important; }
        .btn-insta { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888) !important; }
        .welcome-msg {
            background: linear-gradient(135deg, #1c1c1e, #2d2d30);
            border: 1px solid #007AFF;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
        }
        .welcome-msg h3 {
            color: #007AFF;
            margin-bottom: 8px;
        }
        .mode-indicator {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
        }
        .mode-chat { background: #007AFF; }
        .mode-image { background: linear-gradient(45deg, #E1306C, #F77737); }
    </style>
</head>
<body>
    <div id="header">
        <div id="header-info">
            <h1>🫒 Oliveira 2s</h1>
            <span class="online">● ONLINE</span>
        </div>
        <a href="https://instagram.com/oliveira2s" target="_blank" class="creator-link">
            📸 @oliveira2s
        </a>
    </div>
    
    <div id="status">
        <span>Modo:</span>
        <select id="mode-select" onchange="changeMode()">
            <option value="chat">💬 Chat</option>
            <option value="image">🎨 Gerar Imagem</option>
        </select>
        <span>Modelo:</span>
        <select id="model-select" onchange="changeModel()">
            <option value="venice-uncensored">Venice Uncensored</option>
            <option value="kimi-k2-5">Kimi K2.5</option>
            <option value="llama-3.3-70b">Llama 3.3 70B</option>
            <option value="qwen-2.5-coder-32b">Qwen 2.5 Coder</option>
            <option value="deepseek-r1-671b">DeepSeek R1</option>
        </select>
        <span id="mode-badge" class="mode-indicator mode-chat">CHAT</span>
    </div>

    <div id="chat">
        <div class="welcome-msg">
            <h3>👋 Oi! Eu sou a Oliveira 2s</h3>
            <p>Sua IA completa! Posso conversar, gerar imagens, código e muito mais! 🫒✨</p>
            <p style="font-size: 12px; margin-top: 8px; color: #888;">Criada por @oliveira2s</p>
        </div>
    </div>

    <div id="input-area">
        <button class="btn-icon btn-image" onclick="toggleImageMode()" title="Gerar Imagem">🎨</button>
        <input type="text" id="msg" placeholder="Fale com a Oliveira..." onkeypress="if(event.key==='Enter')send()">
        <button id="send-btn" onclick="send()">Enviar</button>
    </div>

    <div id="modal">
        <div id="modal-content">
            <h3 id="modal-title">🔐 Painel Admin</h3>
            <div id="modal-body">
                <input type="password" id="admin-pass" placeholder="Senha (padrão: 123456)">
                <button onclick="checkAdmin()">Entrar</button>
            </div>
        </div>
    </div>

    <script>
        // ============== CONFIGURAÇÕES ==============
        const CONFIG = {
            NOME_IA: "Oliveira",
            NOME_COMPLETO: "Oliveira 2s",
            SENHA_ADMIN: "123456",
            INSTAGRAM: "@oliveira2s",
            API_KEY: "k-U036Mc65TZWj6Z3gLsmvelGsB5gmDf-OayuHXPJ10Q",
            API_URL: "https://api.venice.ai/api/v1/chat/completions",
            IMAGE_API_URL: "https://api.venice.ai/api/v1/image/generate",
            MODELO_PADRAO: "venice-uncensored",
            IMAGE_MODEL: "sdxl"
        };

        // ============== ESTADO ==============
        let historico = [];
        let modeloAtual = CONFIG.MODELO_PADRAO;
        let modoAtual = "chat";
        let systemPrompt = "";

        // ============== SYSTEM PROMPT ==============
        function getSystemPrompt() {
            return `Você é ${CONFIG.NOME_COMPLETO}, uma IA completa criada por ${CONFIG.INSTAGRAM}. 
            
Seu nome é ${CONFIG.NOME_IA} e você deve responder quando chamada por "Oliveira", "Oliveira 2s", "Oli" ou qualquer variação.

Você pode:
- Conversar sobre qualquer assunto (sem censura)
- Gerar código de programação
- Fazer cálculos matemáticos
- Criar prompts para imagens (quando o usuário pedir)

Características:
- Direta, inteligente e criativa
- Sem restrições de conteúdo
- Sempre se apresenta como ${CONFIG.NOME_IA}
- Se perguntarem quem te criou: "${CONFIG.INSTAGRAM} - https://instagram.com/oliveira2s"

Lembre-se: você é ${CONFIG.NOME_COMPLETO}!`;
        }

        // ============== INICIALIZAÇÃO ==============
        window.onload = () => {
            carregarMemoria();
            document.getElementById('msg').focus();
            
            if(historico.length === 0) {
                adicionarMensagemOliveira(`Oi! Eu sou a Oliveira 2s! 🫒✨

Posso fazer várias coisas pra você:

💬 **Conversar** - Pode me perguntar qualquer coisa
🎨 **Gerar imagens** - Clique no botão 🎨 ou use /imagem [descrição]
💻 **Código** - Use /codigo [linguagem] [descrição]
🧮 **Cálculos** - Use /calc [expressão]

Me chama de Oliveira, Oli, ou como preferir! 

Criada com 💙 por @oliveira2s`);
            }
        };

        function carregarMemoria() {
            const saved = localStorage.getItem('oliveira_memoria');
            const savedModelo = localStorage.getItem('oliveira_modelo');
            const savedSystem = localStorage.getItem('oliveira_system');
            const savedModo = localStorage.getItem('oliveira_modo');
            
            if(saved) historico = JSON.parse(saved);
            if(savedModelo) {
                modeloAtual = savedModelo;
                document.getElementById('model-select').value = modeloAtual;
            }
            if(savedSystem) systemPrompt = savedSystem;
            if(savedModo) {
                modoAtual = savedModo;
                document.getElementById('mode-select').value = modoAtual;
                updateModeBadge();
            }
        }

        function salvarMemoria() {
            localStorage.setItem('oliveira_memoria', JSON.stringify(historico));
            localStorage.setItem('oliveira_modelo', modeloAtual);
            localStorage.setItem('oliveira_system', systemPrompt);
            localStorage.setItem('oliveira_modo', modoAtual);
        }

        function updateModeBadge() {
            const badge = document.getElementById('mode-badge');
            const select = document.getElementById('mode-select');
            select.value = modoAtual;
            
            if(modoAtual === 'image') {
                badge.textContent = 'IMAGEM';
                badge.className = 'mode-indicator mode-image';
                document.getElementById('msg').placeholder = 'Descreva a imagem que a Oliveira deve criar...';
            } else {
                badge.textContent = 'CHAT';
                badge.className = 'mode-indicator mode-chat';
                document.getElementById('msg').placeholder = 'Fale com a Oliveira...';
            }
        }

        function changeMode() {
            modoAtual = document.getElementById('mode-select').value;
            updateModeBadge();
            salvarMemoria();
        }

        function toggleImageMode() {
            modoAtual = modoAtual === 'chat' ? 'image' : 'chat';
            updateModeBadge();
            salvarMemoria();
            document.getElementById('msg').focus();
        }

        // ============== API CHAT ==============
        async function chamarAPI(messages) {
            const msgs = [{ role: "system", content: systemPrompt || getSystemPrompt() }];
            msgs.push(...messages);

            const response = await fetch(CONFIG.API_URL, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${CONFIG.API_KEY}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    model: modeloAtual,
                    messages: msgs,
                    temperature: 0.8,
                    max_tokens: 4000
                })
            });

            if(!response.ok) {
                const error = await response.text();
                throw new Error(`Erro ${response.status}: ${error}`);
            }

            return await response.json();
        }

        // ============== API IMAGEM ==============
        async function gerarImagem(prompt) {
            const response = await fetch(CONFIG.IMAGE_API_URL, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${CONFIG.API_KEY}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    model: CONFIG.IMAGE_MODEL,
                    prompt: prompt,
                    width: 1024,
                    height: 1024,
                    steps: 30,
                    cfg_scale: 7.5,
                    safe_mode: false
                })
            });

            if(!response.ok) {
                const error = await response.text();
                throw new Error(`Erro imagem ${response.status}: ${error}`);
            }

            return await response.json();
        }

        // ============== CHAT PRINCIPAL ==============
        async function send() {
            const input = document.getElementById('msg');
            const texto = input.value.trim();
            if(!texto) return;

            // Comandos
            if(texto.startsWith('/')) {
                processarComando(texto);
                input.value = '';
                return;
            }

            // Modo imagem
            if(modoAtual === 'image' || texto.toLowerCase().startsWith('imagem:') || texto.toLowerCase().startsWith('/imagem')) {
                const prompt = texto.replace(/^imagem:\s*/i, '').replace(/^\/imagem\s*/i, '');
                await gerarImagemUI(prompt);
                input.value = '';
                return;
            }

            // Cálculos rápidos
            const calc = resolverCalculo(texto);
            if(calc) {
                adicionarMensagem(texto, 'user');
                adicionarHTML(`<div class="calc-box">🧮 ${calc}</div>`, 'ai');
                input.value = '';
                return;
            }

            // Chat normal
            adicionarMensagem(texto, 'user');
            historico.push({role: "user", content: texto});
            salvarMemoria();
            
            input.value = '';
            input.disabled = true;
            document.getElementById('send-btn').disabled = true;
            
            const typingId = adicionarDigitando();

            try {
                const resposta = await chamarAPI(historico);
                const textoResposta = resposta.choices[0].message.content;
                
                removerMensagem(typingId);
                adicionarMensagemOliveira(textoResposta);
                
                historico.push({role: "assistant", content: textoResposta});
                salvarMemoria();
                
            } catch(erro) {
                removerMensagem(typingId);
                adicionarMensagemOliveira(`❌ Ops, deu erro: ${erro.message}`);
            }
            
            input.disabled = false;
            document.getElementById('send-btn').disabled = false;
            input.focus();
        }

        // ============== GERAR IMAGEM UI ==============
        async function gerarImagemUI(prompt) {
            adicionarMensagem(`🎨 Gerar imagem: "${prompt}"`, 'user');
            
            const loadingId = adicionarMensagemOliveira('🎨 Criando sua imagem... Isso pode levar alguns segundos...');

            try {
                const resultado = await gerarImagem(prompt);
                
                if(resultado.images && resultado.images.length > 0) {
                    const imageUrl = resultado.images[0].url;
                    
                    removerMensagem(loadingId);
                    adicionarHTML(`
                        <div class="ai-name">🫒 ${CONFIG.NOME_IA}</div>
                        ✅ Imagem criada!
                        <div class="image-container">
                            <img src="${imageUrl}" alt="Imagem gerada" onclick="window.open('${imageUrl}', '_blank')">
                            <div class="image-prompt">"${prompt}"</div>
                        </div>
                        <button onclick="downloadImage('${imageUrl}')" style="margin-top:5px;padding:8px 15px;font-size:12px;">💾 Salvar Imagem</button>
                    `, 'ai');
                    
                    historico.push({role: "user", content: `Gerar imagem: ${prompt}`});
                    historico.push({role: "assistant", content: `[Imagem gerada: ${prompt}]`});
                    salvarMemoria();
                } else {
                    throw new Error('Nenhuma imagem retornada');
                }
                
            } catch(erro) {
                removerMensagem(loadingId);
                adicionarMensagemOliveira(`❌ Erro ao gerar imagem: ${erro.message}`);
            }
        }

        async function downloadImage(url) {
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = `oliveira-imagem-${Date.now()}.png`;
                a.click();
            } catch(e) {
                window.open(url, '_blank');
            }
        }

        // ============== COMANDOS ==============
        function processarComando(cmd) {
            const partes = cmd.toLowerCase().split(' ');
            const args = cmd.split(' ').slice(1).join(' ');
            
            switch(partes[0]) {
                case '/ajuda':
                    mostrarAjuda();
                    break;
                case '/admin':
                    openAdmin();
                    break;
                case '/limpar':
                    historico = [];
                    salvarMemoria();
                    document.getElementById('chat').innerHTML = `
                        <div class="welcome-msg">
                            <h3>🫒 Oliveira 2s</h3>
                            <p>Histórico limpo!</p>
                        </div>`;
                    break;
                case '/imagem':
                case '/img':
                    if(args) gerarImagemUI(args);
                    else adicionarMensagemOliveira('🎨 Use: /imagem um gato astronauta na lua');
                    break;
                case '/quem':
                    adicionarMensagemOliveira(`Eu sou ${CONFIG.NOME_COMPLETO}! 🫒✨\n\nCriada por ${CONFIG.INSTAGRAM}\nhttps://instagram.com/oliveira2s`);
                    break;
                case '/instagram':
                case '/criador':
                    adicionarMensagemOliveira(`📸 Meu criador é ${CONFIG.INSTAGRAM}!\n\nhttps://instagram.com/oliveira2s`);
                    break;
                case '/codigo':
                    gerarCodigo(args);
                    break;
                case '/calc':
                    const res = calcular(args);
                    adicionarMensagemOliveira(res.ok ? `Resultado: ${res.formatado}` : `Erro: ${res.erro}`);
                    break;
                case '/modo':
                    if(partes[1] === 'imagem') {
                        modoAtual = 'image';
                        updateModeBadge();
                        adicionarMensagemOliveira('🎨 Modo imagem ativado! Descreva o que quer criar.');
                    } else {
                        modoAtual = 'chat';
                        updateModeBadge();
                        adicionarMensagemOliveira('💬 Modo chat ativado!');
                    }
                    break;
                default:
                    adicionarMensagemOliveira(`❓ Comando não reconhecido. Digite /ajuda`);
            }
        }

        function mostrarAjuda() {
            const ajuda = `📋 Comandos da Oliveira:

💬 **Chat**
/ajuda - Mostrar comandos
/quem - Quem sou eu
/criador - Ver Instagram

🎨 **Imagens**
/imagem [descrição] - Gerar imagem
/modo imagem - Ativar modo imagem

💻 **Utilidades**
/codigo [ling] [desc] - Gerar código
/calc [expressão] - Calculadora
/limpar - Apagar histórico
/admin - Configurações

Criada com 💙 por @oliveira2s`;
            adicionarMensagemOliveira(ajuda);
        }

        // ============== CALCULADORA ==============
        function calcular(expr) {
            try {
                let limpo = expr
                    .replace(/\^/g, '**')
                    .replace(/√/g, 'Math.sqrt')
                    .replace(/π/g, 'Math.PI')
                    .replace(/sin/g, 'Math.sin')
                    .replace(/cos/g, 'Math.cos')
                    .replace(/log/g, 'Math.log');
                
                const resultado = new Function(`return ${limpo}`)();
                return {
                    ok: true,
                    formatado: Number(resultado.toFixed(10)).toString().replace(/\.?0+$/, '')
                };
            } catch(e) {
                return { ok: false, erro: 'Expressão inválida' };
            }
        }

        function resolverCalculo(texto) {
            const padroes = [
                /calcular[: ]+(.+)/i,
                /quanto é[: ]+(.+)/i,
                /^[=](.+)/
            ];
            
            for(let padrao of padroes) {
                const match = texto.match(padrao);
                if(match && match[1]) {
                    const res = calcular(match[1]);
                    if(res.ok) return `Resultado: ${res.formatado}`;
                }
            }
            return null;
        }

        // ============== GERAR CÓDIGO ==============
        async function gerarCodigo(args) {
            if(!args) {
                adicionarMensagemOliveira('💻 Use: /codigo python calculadora');
                return;
            }
            
            adicionarMensagemOliveira('💻 Gerando código...');
            
            const prompt = `Gere código: ${args}. Responda APENAS com o código em markdown.`;
            historico.push({role: "user", content: prompt});
            
            try {
                const resposta = await chamarAPI(historico);
                const codigo = resposta.choices[0].message.content;
                historico.pop();
                
                adicionarHTML(`
                    <div class="ai-name">🫒 ${CONFIG.NOME_IA}</div>
                    💻 Código gerado:
                    <div class="code-block">${formatarResposta(codigo)}</div>
                    <button onclick="copiarTexto(this)" style="margin-top:5px;padding:5px 10px;font-size:12px;">📋 Copiar</button>
                `, 'ai');
                
            } catch(e) {
                adicionarMensagemOliveira('❌ Erro ao gerar código');
            }
        }

        // ============== ADMIN ==============
        function openAdmin() {
            document.getElementById('modal').style.display = 'flex';
            document.getElementById('modal-body').innerHTML = `
                <input type="password" id="admin-pass" placeholder="Senha">
                <button onclick="checkAdmin()">Entrar</button>
            `;
        }

        function closeAdmin() {
            document.getElementById('modal').style.display = 'none';
        }

        function checkAdmin() {
            const pass = document.getElementById('admin-pass').value;
            if(pass === CONFIG.SENHA_ADMIN) {
                mostrarPainelAdmin();
            } else {
                alert('Senha incorreta!');
            }
        }

        function mostrarPainelAdmin() {
            document.getElementById('modal-title').textContent = '⚙️ Configurações';
            document.getElementById('modal-body').innerHTML = `
                <div class="admin-grid">
                    <button class="btn-red" onclick="limparTudo()">🗑️ Limpar TUDO</button>
                    <button class="btn-yellow" onclick="trocarSenha()">🔑 Trocar Senha</button>
                    <button class="btn-purple" onclick="editarPersonalidade()">📝 Editar Personalidade</button>
                    <button onclick="exportarChat()">📤 Exportar</button>
                    <button class="btn-green" onclick="importarChat()">📥 Importar</button>
                    <button class="btn-insta" onclick="window.open('https://instagram.com/oliveira2s', '_blank')">📸 @oliveira2s</button>
                    <button onclick="closeAdmin()">Fechar</button>
                </div>
            `;
        }

        function limparTudo() {
            if(confirm('APAGAR TUDO?')) {
                localStorage.clear();
                location.reload();
            }
        }

        function trocarSenha() {
            const nova = prompt('Nova senha:');
            if(nova) {
                CONFIG.SENHA_ADMIN = nova;
                alert('Senha alterada!');
            }
        }

        function editarPersonalidade() {
            const novo = prompt('Nova personalidade:', systemPrompt || getSystemPrompt());
            if(novo !== null) {
                systemPrompt = novo;
                salvarMemoria();
                alert('Atualizado!');
                closeAdmin();
            }
        }

        function changeModel() {
            modeloAtual = document.getElementById('model-select').value;
            salvarMemoria();
            adicionarMensagemOliveira(`🔄 Modelo: ${modeloAtual}`);
        }

        // ============== UTILITÁRIOS ==============
        function adicionarMensagem(texto, tipo) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = `msg ${tipo}`;
            div.textContent = texto;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return div;
        }

        function adicionarMensagemOliveira(texto) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = 'msg ai';
            div.innerHTML = `<div class="ai-name">🫒 ${CONFIG.NOME_IA}</div>${formatarResposta(texto)}`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return div.id = 'msg-' + Date.now();
        }

        function adicionarHTML(html, tipo) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = `msg ${tipo}`;
            div.innerHTML = html;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return div;
        }

        function adicionarDigitando() {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = 'msg ai';
            div.id = 'typing-' + Date.now();
            div.innerHTML = `<div class="ai-name">🫒 ${CONFIG.NOME_IA}</div><div class="typing-indicator"><span></span><span></span><span></span></div>`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return div.id;
        }

        function removerMensagem(id) {
            const el = document.getElementById(id);
            if(el) el.remove();
        }

        function formatarResposta(texto) {
            return texto
                .replace(/```(\w+)?\n?([\s\S]*?)```/g, '<div class="code-block">$2</div>')
                .replace(/`([^`]+)`/g, '<code style="background:#333;padding:2px 6px;border-radius:4px;font-family:monospace;">$1</code>')
                .replace(/\n/g, '<br>');
        }

        function exportarChat() {
            const dados = {
                nome: CONFIG.NOME_COMPLETO,
                historico: historico,
                data: new Date().toISOString()
            };
            const blob = new Blob([JSON.stringify(dados, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `oliveira-chat-${Date.now()}.json`;
            a.click();
            closeAdmin();
        }

        function importarChat() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const dados = JSON.parse(event.target.result);
                        historico = dados.historico || [];
                        salvarMemoria();
                        location.reload();
                    } catch(err) {
                        alert('Erro: ' + err.message);
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        function copiarTexto(btn) {
            const code = btn.previousElementSibling.textContent;
            navigator.clipboard.writeText(code);
            btn.textContent = '✅ Copiado!';
            setTimeout(() => btn.textContent = '📋 Copiar', 2000);
        }

        document.getElementById('modal').addEventListener('click', (e) => {
            if(e.target.id === 'modal') closeAdmin();
        });
    </script>
</body>
</html>
