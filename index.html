<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oliveira 2s Pro - Powered by GPT-4</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a25;
            --accent: #10a37f;
            --accent-glow: rgba(16, 163, 127, 0.3);
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            --border: #2d2d3a;
            --success: #10a37f;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        #header {
            padding: 16px 20px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent), #00d084);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        #header h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), #00d084);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--success);
            background: rgba(16, 163, 127, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(16, 163, 127, 0.2);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        .creator-link {
            color: #E1306C;
            text-decoration: none;
            font-size: 13px;
            padding: 8px 14px;
            background: rgba(225, 48, 108, 0.1);
            border-radius: 20px;
            border: 1px solid rgba(225, 48, 108, 0.3);
            transition: all 0.3s;
        }

        .creator-link:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(225, 48, 108, 0.2);
        }

        /* Controls */
        #controls {
            padding: 12px 20px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        select {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            outline: none;
        }

        select:hover {
            border-color: var(--accent);
        }

        /* Chat */
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 85%;
            padding: 16px 20px;
            border-radius: 20px;
            line-height: 1.7;
            animation: messageIn 0.4s ease;
            position: relative;
        }

        @keyframes messageIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            background: linear-gradient(135deg, var(--accent), #00a67e);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            color: white;
        }

        .message.ai {
            background: var(--bg-tertiary);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border);
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .avatar {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, var(--accent), #00d084);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .message-author {
            font-size: 13px;
            font-weight: 600;
            color: var(--accent);
        }

        .message-time {
            font-size: 11px;
            color: var(--text-secondary);
            margin-left: auto;
        }

        .message-content {
            font-size: 15px;
        }

        .message-content p {
            margin-bottom: 10px;
        }

        .message-content p:last-child {
            margin-bottom: 0;
        }

        /* Code Block */
        .code-block {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 12px;
            margin: 12px 0;
            overflow: hidden;
        }

        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            background: #161b22;
            border-bottom: 1px solid #30363d;
        }

        .code-lang {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .code-copy {
            background: transparent;
            border: 1px solid #444;
            color: var(--text-secondary);
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .code-copy:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .code-content {
            padding: 16px;
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 13px;
            overflow-x: auto;
            white-space: pre-wrap;
        }

        /* Calculator */
        .calc-box {
            background: linear-gradient(135deg, rgba(16, 163, 127, 0.1), rgba(16, 163, 127, 0.05));
            border-left: 4px solid var(--accent);
            padding: 16px;
            margin: 12px 0;
            border-radius: 0 12px 12px 0;
        }

        .calc-expr {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .calc-result {
            font-size: 24px;
            font-weight: 700;
            color: var(--accent);
            font-family: 'SF Mono', monospace;
        }

        /* Input Area */
        #input-area {
            display: flex;
            padding: 16px 20px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            gap: 12px;
            align-items: flex-end;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        #msg {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid var(--border);
            border-radius: 25px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: 16px;
            outline: none;
            resize: none;
            min-height: 50px;
            max-height: 150px;
            font-family: inherit;
        }

        #msg:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .btn {
            padding: 14px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            font-size: 20px;
        }

        .btn-send {
            background: var(--accent);
            color: white;
            width: 50px;
            height: 50px;
        }

        .btn-send:hover:not(:disabled) {
            background: #00d084;
            transform: scale(1.05);
        }

        .btn-send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            font-size: 18px;
        }

        .btn-secondary:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Typing */
        .typing {
            display: flex;
            gap: 4px;
            padding: 8px 0;
        }

        .typing span {
            width: 10px;
            height: 10px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: typingBounce 1.4s infinite ease-in-out;
        }

        .typing span:nth-child(1) { animation-delay: -0.32s; }
        .typing span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes typingBounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Welcome */
        .welcome-card {
            background: linear-gradient(135deg, var(--bg-tertiary), rgba(16, 163, 127, 0.1));
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .welcome-card h2 {
            font-size: 24px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, var(--accent), #00d084);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .welcome-card p {
            color: var(--text-secondary);
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        .feature {
            background: var(--bg-secondary);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.3s;
        }

        .feature:hover {
            border-color: var(--accent);
            transform: translateY(-3px);
        }

        .feature-icon {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .feature-text {
            font-size: 13px;
            font-weight: 500;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--bg-secondary);
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
        }

        .modal-body {
            padding: 20px;
        }

        .admin-btn {
            width: 100%;
            padding: 14px;
            margin-bottom: 10px;
            border-radius: 10px;
            border: none;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-danger { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }
        .btn-success { background: rgba(16, 163, 127, 0.1); color: var(--success); border: 1px solid rgba(16, 163, 127, 0.3); }
        .btn-warning { background: rgba(245, 158, 11, 0.1); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.3); }

        /* Responsive */
        @media (max-width: 600px) {
            .features { grid-template-columns: 1fr; }
            .message { max-width: 90%; }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }
    </style>
</head>
<body>
    <header id="header">
        <div id="logo-section">
            <div id="logo">🫒</div>
            <h1>Oliveira 2s</h1>
            <div class="status-badge">
                <span class="status-dot"></span>
                <span>GPT-4 Ativo</span>
            </div>
        </div>
        <a href="https://instagram.com/oliveira2s" class="creator-link">📸 @oliveira2s</a>
    </header>

    <div id="controls">
        <div class="control-group">
            <span class="control-label">Modelo:</span>
            <select id="model-select" onchange="changeModel()">
                <option value="gpt-4">GPT-4 (Mais Inteligente)</option>
                <option value="gpt-3.5-turbo">GPT-3.5 (Mais Rápido)</option>
            </select>
        </div>
        <div class="control-group">
            <span class="control-label">Modo:</span>
            <select id="mode-select">
                <option value="normal">Normal</option>
                <option value="code">Programador</option>
                <option value="creative">Criativo</option>
            </select>
        </div>
    </div>

    <div id="chat">
        <div class="welcome-card">
            <h2>👋 Olá! Eu sou a Oliveira 2s</h2>
            <p>Agora com <strong>GPT-4</strong>! Posso responder qualquer pergunta, criar códigos, fazer cálculos complexos e muito mais.</p>
            <div class="features">
                <div class="feature" onclick="sendQuick('Explique a teoria da relatividade de Einstein')">
                    <div class="feature-icon">🧠</div>
                    <div class="feature-text">Conhecimento</div>
                </div>
                <div class="feature" onclick="sendQuick('Crie um jogo da velha em HTML/CSS/JS')">
                    <div class="feature-icon">💻</div>
                    <div class="feature-text">Programação</div>
                </div>
                <div class="feature" onclick="sendQuick('Calcule a raiz quadrada de 144 multiplicada por π')">
                    <div class="feature-icon">🧮</div>
                    <div class="feature-text">Matemática</div>
                </div>
                <div class="feature" onclick="sendQuick('Escreva uma poesia sobre tecnologia')">
                    <div class="feature-icon">✨</div>
                    <div class="feature-text">Criatividade</div>
                </div>
            </div>
        </div>
    </div>

    <div id="input-area">
        <button class="btn btn-secondary" onclick="openSettings()" title="Configurações">⚙️</button>
        <div class="input-wrapper">
            <textarea id="msg" placeholder="Digite qualquer coisa..." rows="1" oninput="autoResize(this)" onkeydown="handleKeyDown(event)"></textarea>
        </div>
        <button class="btn btn-send" id="send-btn" onclick="sendMessage()">➤</button>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">⚙️ Configurações</h3>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body">
                <button class="admin-btn btn-danger" onclick="clearChat()">🗑️ Limpar Conversa</button>
                <button class="admin-btn btn-warning" onclick="exportChat()">📥 Exportar Chat</button>
                <button class="admin-btn btn-success" onclick="window.open('https://instagram.com/oliveira2s', '_blank')">📸 @oliveira2s</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURAÇÃO - SUA API KEY DA OPENAI
        // ==========================================
        const CONFIG = {
            API_KEY: "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",
            API_URL: "https://api.openai.com/v1/chat/completions",
            NOME: "Oliveira 2s",
            CRIADOR: "@oliveira2s"
        };

        let historico = [];
        let modeloAtual = "gpt-4";
        let isTyping = false;

        // ==========================================
        // INICIALIZAÇÃO
        // ==========================================
        window.onload = () => {
            carregarChat();
            document.getElementById('msg').focus();
        };

        function carregarChat() {
            const salvo = localStorage.getItem('oliveira_chat');
            if (salvo) {
                historico = JSON.parse(salvo);
                renderizarChat();
            }
        }

        function salvarChat() {
            localStorage.setItem('oliveira_chat', JSON.stringify(historico.slice(-50)));
        }

        // ==========================================
        // ENVIO DE MENSAGENS
        // ==========================================
        async function sendMessage() {
            const input = document.getElementById('msg');
            const texto = input.value.trim();
            
            if (!texto || isTyping) return;

            // Verificar comandos especiais
            if (texto.startsWith('/')) {
                processarComando(texto);
                input.value = '';
                return;
            }

            // Verificar cálculo rápido
            const calc = calcularExpressao(texto);
            if (calc) {
                addMessage(texto, 'user');
                addCalcBox(calc.expr, calc.result);
                input.value = '';
                return;
            }

            // Adicionar mensagem do usuário
            addMessage(texto, 'user');
            historico.push({ role: "user", content: texto });
            salvarChat();

            // Limpar input
            input.value = '';
            autoResize(input);
            input.disabled = true;
            document.getElementById('send-btn').disabled = true;
            isTyping = true;

            // Mostrar indicador de digitação
            const typingId = addTypingIndicator();

            try {
                // Chamar API da OpenAI
                const resposta = await chamarOpenAI();
                
                removeTypingIndicator(typingId);
                addMessage(resposta, 'ai');
                historico.push({ role: "assistant", content: resposta });
                salvarChat();

            } catch (erro) {
                removeTypingIndicator(typingId);
                addMessage(`❌ Erro: ${erro.message}\n\nVerifique sua conexão ou tente novamente.`, 'ai');
            }

            input.disabled = false;
            document.getElementById('send-btn').disabled = false;
            input.focus();
            isTyping = false;
        }

        // ==========================================
        // API OPENAI
        // ==========================================
        async function chamarOpenAI() {
            const modo = document.getElementById('mode-select').value;
            
            let systemPrompt = `Você é ${CONFIG.NOME}, uma IA inteligente criada por ${CONFIG.CRIADOR}. `;
            
            if (modo === 'code') {
                systemPrompt += "Você é um programador especialista. Forneça código limpo, comentado e funcional.";
            } else if (modo === 'creative') {
                systemPrompt += "Você é criativo e imaginativo. Use metáforas e linguagem evocativa.";
            } else {
                systemPrompt += "Você é direto, claro e completo nas respostas. Explique de forma didática.";
            }

            const response = await fetch(CONFIG.API_URL, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${CONFIG.API_KEY}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    model: modeloAtual,
                    messages: [
                        { role: "system", content: systemPrompt },
                        ...historico.slice(-10)
                    ],
                    temperature: 0.8,
                    max_tokens: 2000
                })
            });

            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.error?.message || `Erro ${response.status}`);
            }

            const data = await response.json();
            return data.choices[0].message.content;
        }

        // ==========================================
        // INTERFACE
        // ==========================================
        function addMessage(texto, tipo) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = 'message ' + tipo;
            
            const hora = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            
            if (tipo === 'user') {
                div.innerHTML = `
                    <div class="message-content">${formatarTexto(texto)}</div>
                    <div class="message-time">${hora}</div>
                `;
            } else {
                div.innerHTML = `
                    <div class="message-header">
                        <div class="avatar">🫒</div>
                        <span class="message-author">${CONFIG.NOME}</span>
                        <span class="message-time">${hora}</span>
                    </div>
                    <div class="message-content">${formatarResposta(texto)}</div>
                `;
            }
            
            chat.appendChild(div);
            scrollToBottom();
        }

        function addTypingIndicator() {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = 'message ai';
            div.id = 'typing-indicator';
            div.innerHTML = `
                <div class="message-header">
                    <div class="avatar">🫒</div>
                    <span class="message-author">${CONFIG.NOME}</span>
                </div>
                <div class="typing"><span></span><span></span><span></span></div>
            `;
            chat.appendChild(div);
            scrollToBottom();
            return div.id;
        }

        function removeTypingIndicator(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function addCalcBox(expr, resultado) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = 'message ai';
            div.innerHTML = `
                <div class="message-header">
                    <div class="avatar">🫒</div>
                    <span class="message-author">${CONFIG.NOME}</span>
                </div>
                <div class="calc-box">
                    <div class="calc-expr">🧮 ${expr}</div>
                    <div class="calc-result">${resultado}</div>
                </div>
            `;
            chat.appendChild(div);
            scrollToBottom();
        }

        function formatarTexto(texto) {
            return texto
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/\n/g, '<br>');
        }

        function formatarResposta(texto) {
            // Processar markdown básico
            let html = texto
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/`(.*?)`/g, '<code style="background:#2d2d3a;padding:2px 6px;border-radius:4px;font-family:monospace;">$1</code>')
                .replace(/\n/g, '<br>');

            // Code blocks
            html = html.replace(/```(\w+)?\n?([\s\S]*?)```/g, function(match, lang, code) {
                return `<div class="code-block">
                    <div class="code-header">
                        <span class="code-lang">${lang || 'code'}</span>
                        <button class="code-copy" onclick="copiarCodigo(this)">Copiar</button>
                    </div>
                    <div class="code-content">${code}</div>
                </div>`;
            });

            return html;
        }

        function scrollToBottom() {
            document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 150) + 'px';
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        // ==========================================
        // FERRAMENTAS
        // ==========================================
        function calcularExpressao(texto) {
            const padroes = [
                /^calc\s+(.+)/i,
                /^calcular\s+(.+)/i,
                /^=\s*(.+)/,
                /^([0-9+\-*/().\s^√π]+)$/
            ];

            for (let padrao of padroes) {
                const match = texto.match(padrao);
                if (match && match[1]) {
                    try {
                        let expr = match[1]
                            .replace(/\^/g, '**')
                            .replace(/√(\d+)/g, 'Math.sqrt($1)')
                            .replace(/π/g, 'Math.PI')
                            .replace(/sen|sin/g, 'Math.sin')
                            .replace(/cos/g, 'Math.cos')
                            .replace(/tan/g, 'Math.tan')
                            .replace(/log/g, 'Math.log')
                            .replace(/,/g, '.');

                        const resultado = Function('"use strict"; return (' + expr + ')')();
                        
                        return {
                            expr: match[1],
                            result: Number(resultado.toFixed(10)).toString().replace(/\.?0+$/, '')
                        };
                    } catch (e) {}
                }
            }
            return null;
        }

        function processarComando(cmd) {
            const partes = cmd.toLowerCase().split(' ');
            
            switch(partes[0]) {
                case '/ajuda':
                    addMessage(`📋 **Comandos disponíveis:**

/ajuda - Mostrar comandos
/calc [expressão] - Calculadora
/limpar - Apagar histórico
/exportar - Salvar conversa

Ou simplesmente digite sua pergunta!`, 'ai');
                    break;
                    
                case '/limpar':
                    if (confirm('Limpar toda a conversa?')) {
                        historico = [];
                        salvarChat();
                        document.getElementById('chat').innerHTML = '';
                        addMessage('✅ Conversa limpa!', 'ai');
                    }
                    break;
                    
                case '/exportar':
                    exportChat();
                    break;
                    
                default:
                    addMessage(`❓ Comando não reconhecido: ${cmd}\n\nDigite /ajuda para ver os comandos.`, 'ai');
            }
        }

        function copiarCodigo(btn) {
            const code = btn.parentElement.nextElementSibling.textContent;
            navigator.clipboard.writeText(code).then(() => {
                btn.textContent = '✓ Copiado!';
                setTimeout(() => btn.textContent = 'Copiar', 2000);
            });
        }

        // ==========================================
        // CONTROLES
        // ==========================================
        function changeModel() {
            modeloAtual = document.getElementById('model-select').value;
            addMessage(`🔄 Modelo alterado para: **${modeloAtual.toUpperCase()}**`, 'ai');
        }

        function sendQuick(texto) {
            document.getElementById('msg').value = texto;
            sendMessage();
        }

        function openSettings() {
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function clearChat() {
            if (confirm('Apagar toda a conversa?')) {
                historico = [];
                salvarChat();
                document.getElementById('chat').innerHTML = '';
                closeModal();
            }
        }

        function exportChat() {
            const dados = {
                nome: CONFIG.NOME,
                data: new Date().toISOString(),
                conversa: historico
            };
            
            const blob = new Blob([JSON.stringify(dados, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `oliveira-chat-${Date.now()}.json`;
            a.click();
            
            closeModal();
        }

        // Fechar modal ao clicar fora
        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.id === 'modal') closeModal();
        });
    </script>
</body>
</html>
