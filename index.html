<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha IA</title>
    <style>
        body { 
            background: #1a1a1a; 
            color: white; 
            font-family: Arial; 
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #chat { 
            flex: 1; 
            overflow-y: auto; 
            padding: 10px; 
        }
        .msg { 
            margin: 10px 0; 
            padding: 10px; 
            border-radius: 10px; 
            max-width: 80%;
        }
        .user { background: #007AFF; margin-left: auto; }
        .ai { background: #333; }
        #input-area { 
            display: flex; 
            padding: 10px; 
            background: #222;
        }
        input { 
            flex: 1; 
            padding: 10px; 
            border: none; 
            border-radius: 20px;
        }
        button { 
            padding: 10px 20px; 
            margin-left: 10px;
            background: #007AFF;
            color: white;
            border: none;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div id="chat"></div>
    <div id="input-area">
        <input type="text" id="msg" placeholder="Digite..." onkeypress="if(event.key=='Enter')send()">
        <button onclick="send()">Enviar</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.76/lib/index.js"></script>
    <script>
        // SUA SENHA DE ADMIN
        const SENHA = "123456";
        
        let ia = null;
        let historico = [];

        // Carregar memória salva
        if(localStorage.getItem('chat')) {
            historico = JSON.parse(localStorage.getItem('chat'));
            mostrar();
        }

        // Iniciar IA
        async function iniciar() {
            add("⏳ Carregando IA... (primeira vez demora)", "ai");
            
            ia = new webllm.MLCEngine();
            
            await ia.reload("Llama-3.2-3B-Instruct-q4f32_1-MLC");
            
            add("✅ IA pronta! Pode falar.", "ai");
        }

        // Enviar mensagem
        async function send() {
            const input = document.getElementById('msg');
            const texto = input.value.trim();
            if(!texto) return;
            
            // Comandos especiais
            if(texto === "/admin") {
                const senha = prompt("Senha:");
                if(senha === SENHA) {
                    add("🔓 Modo admin ativado. Comandos: /limpar /exportar /uncensored", "ai");
                }
                input.value = "";
                return;
            }
            
            if(texto === "/limpar") {
                historico = [];
                localStorage.removeItem('chat');
                document.getElementById('chat').innerHTML = '';
                input.value = "";
                return;
            }
            
            if(texto === "/exportar") {
                const blob = new Blob([JSON.stringify(historico)], {type: 'application/json'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'chat.json';
                a.click();
                input.value = "";
                return;
            }

            // Mensagem normal
            add(texto, "user");
            input.value = "";
            
            historico.push({role: "user", content: texto});
            
            // Responder
            const resposta = await ia.chat.completions.create({
                messages: historico,
                temperature: 0.8
            });
            
            const respostaTexto = resposta.choices[0].message.content;
            add(respostaTexto, "ai");
            
            historico.push({role: "assistant", content: respostaTexto});
            localStorage.setItem('chat', JSON.stringify(historico));
        }

        // Mostrar mensagem na tela
        function add(texto, quem) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = 'msg ' + quem;
            div.textContent = texto;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        // Mostrar histórico salvo
        function mostrar() {
            historico.forEach(m => add(m.content, m.role === 'user' ? 'user' : 'ai'));
        }

        // Iniciar automaticamente
        iniciar();
    </script>
</body>
</html>
